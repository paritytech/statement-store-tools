name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # polkadot-sdk pin: bump this in lockstep with the git rev in Cargo.toml.
  POLKADOT_SDK_REF: 1a69ade75f028819b70652a25a7ba4e9fa427076

jobs:
  isdraft:
    uses: paritytech/polkadot-sdk/.github/workflows/reusable-isdraft.yml@1a69ade75f028819b70652a25a7ba4e9fa427076

  preflight:
    needs: isdraft
    uses: paritytech/polkadot-sdk/.github/workflows/reusable-preflight.yml@1a69ade75f028819b70652a25a7ba4e9fa427076

  test:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ needs.preflight.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: cargo test
        run: forklift cargo test --locked --release

  build:
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.RUNNER }}
    timeout-minutes: 60
    container:
      image: ${{ needs.preflight.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: build
        run: |
          forklift cargo build --locked --release \
            --bin statement-latency-bench \
            --bin setup-allowances
      - name: pack artifacts
        run: |
          mkdir -p ./artifacts
          mv ./target/release/statement-latency-bench ./artifacts/.
          mv ./target/release/setup-allowances ./artifacts/.
          echo -n "${{ needs.preflight.outputs.SOURCE_REF_SLUG }}" > ./artifacts/VERSION
          echo -n "${{ needs.preflight.outputs.SOURCE_REF_SLUG }}-${COMMIT_SHA}" > ./artifacts/EXTRATAG
          echo "statement-store-tools = $(cat ./artifacts/VERSION) (EXTRATAG = $(cat ./artifacts/EXTRATAG))"
          cp -r ./docker/* ./artifacts
      - name: tar
        run: tar -cvf artifacts.tar artifacts
      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ needs.preflight.outputs.SOURCE_REF_SLUG }}
          path: artifacts.tar
          retention-days: 1

  build-push-image:
    needs: [preflight, build, test]
    runs-on: ${{ needs.preflight.outputs.RUNNER_DEFAULT }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ needs.preflight.outputs.SOURCE_REF_SLUG }}
      - name: tar
        run: tar -xvf artifacts.tar
      - name: build and push image
        uses: paritytech/polkadot-sdk/.github/actions/build-push-image@1a69ade75f028819b70652a25a7ba4e9fa427076
        with:
          image-name: "statement-store-tools"
          dockerfile: "docker/dockerfiles/statement-store-tools_injected.Dockerfile"
          username: ${{ secrets.PARITYPR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PARITYPR_DOCKERHUB_PASSWORD }}
